<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OCGO skin background</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  :root[data-theme="light"] {
    --card: rgba(255, 255, 255, .76);
    --card-inner: rgba(255, 255, 255, .34);
    --stroke: rgba(0, 0, 0, .06);
    --text: rgba(0, 0, 0, .89);
    --text2: rgba(0, 0, 0, .55);
    --accent: #0067C0;
    --accent-fg: #ffffff;
  }
  :root[data-theme="dark"] {
    --card: rgba(28, 28, 30, .76);
    --card-inner: rgba(255, 255, 255, .05);
    --stroke: rgba(255, 255, 255, .08);
    --text: rgba(255, 255, 255, .92);
    --text2: rgba(255, 255, 255, .55);
    --accent: #4CC2FF;
    --accent-fg: #06222f;
  }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-size: 12px;
  }
  .win {
    position: relative;
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: 8px;
    overflow: hidden;
  }
  .head { position: absolute; left: 0; top: 0; right: 0; }
  .logo {
    position: absolute; border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 58%, #7a4dff));
    display: flex; align-items: center; justify-content: center; color: var(--accent-fg);
  }
  .title { position: absolute; font-size: 13px; font-weight: 600; letter-spacing: .1px; color: var(--text); }
  .live {
    position: absolute; display: flex; align-items: center; gap: 5px;
    border-radius: 10px; background: var(--card-inner); border: 1px solid var(--stroke);
    font-size: 11px; color: var(--text2); padding: 0 9px;
  }
  .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .card {
    position: absolute; border-radius: 8px;
    background: var(--card-inner); border: 1px solid var(--stroke);
  }
  .row { position: absolute; height: 28px; display: flex; align-items: center; gap: 8px; }
  .row svg { width: 16px; height: 16px; flex: none; color: var(--text2); }
  .row .label { font-size: 12px; color: var(--text2); white-space: nowrap; }
  .sect { position: absolute; display: flex; align-items: center; gap: 6px; }
  .sect svg { width: 14px; height: 14px; color: var(--accent); }
  .sect .t { font-size: 12px; font-weight: 600; color: var(--text); letter-spacing: .2px; }
  .glabel { position: absolute; font-size: 12px; color: var(--text2); line-height: 28px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="ic-up" viewBox="0 0 16 16"><path d="M8 13.2V3.2M4.2 6.6 8 2.8l3.8 3.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-down" viewBox="0 0 16 16"><path d="M8 2.8v10M4.2 9.4 8 13.2l3.8-3.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-cpu" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1.2"/><rect x="6.8" y="6.8" width="2.4" height="2.4" rx=".5"/><path d="M8 1.6v2.6M8 11.8v2.6M1.6 8h2.6M11.8 8h2.6"/></g></symbol>
    <symbol id="ic-gpu" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="4.2" width="12.4" height="7.6" rx="1.2"/><circle cx="5.8" cy="8" r="1.9"/><path d="M9.6 8h2.6"/></g></symbol>
    <symbol id="ic-temp" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 8.9V3.7a1.4 1.4 0 1 1 2.8 0v5.2a2.6 2.6 0 1 1-2.8 0Z"/><path d="M8 6.4v3.6"/></g></symbol>
    <symbol id="ic-freq" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.4 11.7a5.6 5.6 0 1 1 11.2 0"/><path d="M8 11.7 10.6 6.6"/></g></symbol>
    <symbol id="ic-mem" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="12" height="6" rx="1"/><path d="M4.6 11v1.7M8 11v1.7M11.4 11v1.7M2 8h12"/></g></symbol>
    <symbol id="ic-go" viewBox="0 0 16 16"><path d="M8 1.8 9.3 6l4.2 1.3-4.2 1.3L8 12.8 6.7 8.6 2.5 7.3 6.7 6 8 1.8Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-pulse" viewBox="0 0 16 16"><path d="M1.8 8.4h2.9L6.2 4l2.2 8 1.8-4.3 1.2 1.7h2.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>
<div id="out"></div>
<script>
const q = new URLSearchParams(location.search);
const theme = q.get('theme') === 'dark' ? 'dark' : 'light';
const mode = q.get('mode') === 's' ? 's' : 'l';
document.documentElement.dataset.theme = theme;

const COL1 = 20;                      // 单列内容左边缘
const ICON = 16;

const L = {
  w: 260, h: 424,
  head: { h: 36, logo: [12, 7, 22], title: [42, 13], live: { top: 8, h: 20 } },
  card1: { x: 8, y: 36, w: 244, h: 244 },
  rows: [
    { y: 46,  ic: 'up',   label: '上传' },
    { y: 74,  ic: 'down', label: '下载' },
    { y: 102, ic: 'cpu',  label: 'CPU 使用率' },
    { y: 130, ic: 'temp', label: 'CPU 温度' },
    { y: 158, ic: 'gpu',  label: 'GPU 使用率' },
    { y: 186, ic: 'temp', label: 'GPU 温度' },
    { y: 214, ic: 'mem',  label: '内存占用' },
    { y: 242, ic: 'freq', label: 'CPU 频率' },
  ],
  card2: { x: 8, y: 288, w: 244, h: 128 },
  sect: { x: 20, y: 298, h: 20, icon: 14, label: 'OpenCode Go' },
  go: [
    { y: 322, label: '5 小时' },
    { y: 350, label: '每周' },
    { y: 378, label: '每月' },
  ],
  resetLabel: 160,
  remainLabel: 76,
};

const S = {
  w: 260, h: 220,
  head: { h: 32, logo: [12, 6, 20], title: [40, 12], live: { top: 7, h: 18 } },
  card1: { x: 8, y: 32, w: 244, h: 180 },
  rows: [
    { y: 38,  ic: 'up',   label: '上传' },
    { y: 66,  ic: 'down', label: '下载' },
    { y: 94,  ic: 'cpu',  label: 'CPU 使用率' },
    { y: 122, ic: 'temp', label: 'CPU 温度' },
    { y: 150, ic: 'gpu',  label: 'GPU 使用率' },
    { y: 178, ic: 'mem',  label: '内存占用' },
  ],
};

const C = mode === 's' ? S : L;
const icon = (id, size) => `<svg width="${size}" height="${size}"><use href="#ic-${id}"/></svg>`;

let html = '';
// 头部
const [lx, ly, ls] = C.head.logo;
html += `<div class="logo" style="left:${lx}px;top:${ly}px;width:${ls}px;height:${ls}px">${icon('pulse', Math.round(ls * .64))}</div>`;
const [tx, tsize] = C.head.title;
const titleTop = Math.round((C.head.h - tsize * 1.35) / 2);
html += `<div class="title" style="left:${tx}px;top:${titleTop}px;font-size:${tsize}px">性能监控</div>`;
html += `<div class="live" style="right:12px;top:${C.head.live.top}px;height:${C.head.live.h}px"><i></i>实时</div>`;

// 指标卡
html += `<div class="card" style="left:${C.card1.x}px;top:${C.card1.y}px;width:${C.card1.w}px;height:${C.card1.h}px"></div>`;
for (const r of C.rows) {
  html += `<div class="row" style="left:${COL1}px;top:${r.y}px">${icon(r.ic, ICON)}<span class="label">${r.label}</span></div>`;
}

// Go 卡
if (mode === 'l') {
  html += `<div class="card" style="left:${C.card2.x}px;top:${C.card2.y}px;width:${C.card2.w}px;height:${C.card2.h}px"></div>`;
  html += `<div class="sect" style="left:${C.sect.x}px;top:${C.sect.y}px;height:${C.sect.h}px">${icon('go', C.sect.icon)}<span class="t">${C.sect.label}</span></div>`;
  for (const g of C.go) {
    html += `<div class="glabel" style="left:${COL1}px;top:${g.y}px">${g.label}</div>`;
    html += `<div class="glabel" style="left:${C.remainLabel}px;top:${g.y}px">剩余</div>`;
    html += `<div class="glabel" style="left:${C.resetLabel}px;top:${g.y}px">重置</div>`;
  }
}

document.getElementById('out').innerHTML =
  `<div class="win" style="width:${C.w}px;height:${C.h}px">${html}</div>`;
document.title = `${theme}-${mode}-${C.w}x${C.h}`;
</script>
</body>
</html>
